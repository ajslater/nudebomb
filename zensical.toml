[project]
site_name = "Nudebomb"
site_url = "https://nudebomb.readthedocs.io/"
site_author = "AJ"
site_description = "The Nudebomb recursively strips matroska media files of unwanted audio and subtitle tracks."
docs_dir = "docs"
nav = ["NEWS.md"]

[project.theme]
variant = "modern"
features = ["content.code.copy", "navigation.footer", "search.highlight"]

[project.theme.palette]
scheme = "slate"

[project.markdown_extensions]
smarty = {}
toc.permalink = true

[project.plugins.minify]
minify_html = true
minify_inline_js = true
minify_inline_css = true
